<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>study-quiz-serio</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
         background: #f6f7f9; color: #1a1a1a; }
  @media (prefers-color-scheme: dark) { body { background: #16181c; color: #e7e7e7; } }
  .wrap { max-width: 720px; margin: 0 auto; padding: 24px 20px 48px; }
  .bar { display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
         margin-bottom: 18px; flex-wrap: wrap; }
  .bar h1 { font-size: 16px; margin: 0; font-weight: 600; }
  #timer { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 18px;
           padding: 2px 10px; border-radius: 999px; background: rgba(127,127,127,.15); }
  #timer.warn { background: rgba(220,80,40,.18); color: #d34a28; }
  .card { background: #fff; border-radius: 14px; padding: 24px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  @media (prefers-color-scheme: dark) { .card { background: #1f2228; box-shadow: none; } }
  .progress { display: flex; gap: 6px; margin-bottom: 18px; }
  .progress .dot { flex: 1; height: 4px; border-radius: 2px; background: rgba(127,127,127,.25); }
  .progress .dot.done { background: #4a7ddb; }
  .progress .dot.current { background: #4a7ddb; opacity: .5; }
  .meta { font-size: 13px; opacity: .7; margin-bottom: 8px; }
  .pergunta { font-size: 17px; margin: 0 0 20px; }
  .pergunta p { margin: 0 0 10px; }
  .alt { display: block; width: 100%; text-align: left; padding: 14px 16px; margin-bottom: 10px;
         border: 2px solid rgba(127,127,127,.3); border-radius: 10px; background: transparent;
         color: inherit; font: inherit; cursor: pointer; transition: border-color .15s, background .15s; }
  .alt:hover { border-color: rgba(74,125,219,.6); }
  .alt.selecionada { border-color: #4a7ddb; background: rgba(74,125,219,.12); font-weight: 600; }
  .acoes { display: flex; justify-content: flex-end; margin-top: 20px; }
  button.primaria { background: #4a7ddb; color: #fff; border: none; border-radius: 10px;
                     padding: 12px 22px; font: inherit; font-weight: 600; cursor: pointer; }
  button.primaria:disabled { opacity: .4; cursor: not-allowed; }
  button.primaria:not(:disabled):hover { background: #3a6bc4; }
  .intro h2, .fim h2 { margin-top: 0; }
  .fim .score { font-size: 40px; font-weight: 800; margin: 4px 0; }
  .fim .score-sub { opacity: .7; margin-bottom: 20px; }
  .fim .bloco { margin-top: 22px; }
  .fim .bloco h3 { font-size: 14px; text-transform: uppercase; letter-spacing: .04em; opacity: .65;
                    margin-bottom: 10px; }
  .topico { border-left: 2px solid #d34a28; padding: 4px 0 4px 12px; margin-bottom: 14px; }
  .topico.dominado { border-left-color: #2f9e5f; }
  .topico .nome { font-weight: 600; }
  .topico .taxa { opacity: .7; font-size: 13px; }
  .topico .ler { font-size: 14px; margin-top: 4px; }
  .rodape { margin-top: 28px; font-size: 13px; opacity: .65; text-align: center; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <h1 id="titulo">Quiz</h1>
    <span id="timer" hidden>00:00</span>
  </div>

  <div class="card intro" id="tela-intro">
    <h2 id="intro-titulo">Carregando…</h2>
    <p id="intro-desc"></p>
    <p class="meta" id="intro-meta"></p>
    <p class="meta">Ao começar: sem voltar, sem "verificar" por questão — só avançar. O resultado
       aparece inteiro no final.</p>
    <div class="acoes"><button class="primaria" id="btn-comecar">Começar</button></div>
  </div>

  <div class="card" id="tela-questao" hidden>
    <div class="progress" id="progress"></div>
    <p class="meta" id="questao-contador"></p>
    <div class="pergunta" id="questao-texto"></div>
    <div id="alternativas"></div>
    <div class="acoes"><button class="primaria" id="btn-avancar" disabled>Avançar</button></div>
  </div>

  <div class="card fim" id="tela-fim" hidden>
    <h2>Resultado</h2>
    <div class="score" id="fim-score"></div>
    <div class="score-sub" id="fim-sub"></div>
    <div id="fim-feedback"></div>

    <div class="bloco" id="bloco-fracos" hidden>
      <h3>Pontos fracos — revisar antes da próxima tentativa</h3>
      <div id="lista-fracos"></div>
    </div>
    <div class="bloco" id="bloco-dominados" hidden>
      <h3>Dominado (100%)</h3>
      <div id="lista-dominados"></div>
    </div>

    <p class="rodape" id="rodape-status">salvando resultado…</p>
  </div>
</div>

<script>
(function () {
  var telaIntro = document.getElementById('tela-intro');
  var telaQuestao = document.getElementById('tela-questao');
  var telaFim = document.getElementById('tela-fim');
  var timerEl = document.getElementById('timer');
  var tituloEl = document.getElementById('titulo');

  var quiz = null;
  var idx = -1;
  var respostas = [];
  var selecionadaIdx = null;
  var iniciadoEm = null;
  var perguntaMostradaEm = null;
  var timerHandle = null;
  var limiteSeg = 0;

  function fmtMMSS(totalSeg) {
    totalSeg = Math.max(0, Math.floor(totalSeg));
    var mm = String(Math.floor(totalSeg / 60)).padStart(2, '0');
    var ss = String(totalSeg % 60).padStart(2, '0');
    return mm + ':' + ss;
  }

  function tick() {
    var s = (Date.now() - iniciadoEm) / 1000;
    var restante = limiteSeg ? limiteSeg - s : s;
    timerEl.textContent = fmtMMSS(restante);
    timerEl.classList.toggle('warn', !!limiteSeg && restante <= 60);
  }

  function pararTimer() {
    if (timerHandle) { clearInterval(timerHandle); timerHandle = null; }
  }

  fetch('quiz.json').then(function (r) { return r.json(); }).then(function (data) {
    quiz = data;
    tituloEl.textContent = quiz.titulo || 'Quiz';
    document.title = quiz.titulo || 'study-quiz-serio';
    document.getElementById('intro-titulo').textContent = quiz.titulo || 'Quiz';
    document.getElementById('intro-desc').textContent =
      (quiz.materia ? quiz.materia + ' · ' : '') + (quiz.tema || '');
    document.getElementById('intro-meta').textContent =
      quiz.questoes.length + ' questão(ões)' +
      (quiz.tempo_limite_seg ? ' · limite sugerido: ' + fmtMMSS(quiz.tempo_limite_seg) : '');
    limiteSeg = quiz.tempo_limite_seg || 0;
  }).catch(function (err) {
    document.getElementById('intro-desc').textContent = 'erro ao carregar quiz.json: ' + err;
  });

  document.getElementById('btn-comecar').addEventListener('click', function () {
    iniciadoEm = Date.now();
    timerEl.hidden = false;
    tick();
    timerHandle = setInterval(tick, 1000);
    telaIntro.hidden = true;
    telaQuestao.hidden = false;
    proximaQuestao();
  });

  function renderProgress() {
    var el = document.getElementById('progress');
    el.innerHTML = '';
    quiz.questoes.forEach(function (_, i) {
      var d = document.createElement('div');
      d.className = 'dot' + (i < idx ? ' done' : i === idx ? ' current' : '');
      el.appendChild(d);
    });
  }

  function proximaQuestao() {
    idx += 1;
    selecionadaIdx = null;
    perguntaMostradaEm = Date.now();
    renderProgress();
    var q = quiz.questoes[idx];
    document.getElementById('questao-contador').textContent =
      'Questão ' + (idx + 1) + ' de ' + quiz.questoes.length;
    document.getElementById('questao-texto').innerHTML = q.pergunta;
    var altsEl = document.getElementById('alternativas');
    altsEl.innerHTML = '';
    q.alternativas.forEach(function (texto, i) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'alt';
      b.innerHTML = texto;
      b.addEventListener('click', function () {
        selecionadaIdx = i;
        Array.prototype.forEach.call(altsEl.querySelectorAll('.alt'), function (el, j) {
          el.classList.toggle('selecionada', j === i);
        });
        document.getElementById('btn-avancar').disabled = false;
      });
      altsEl.appendChild(b);
    });
    var btn = document.getElementById('btn-avancar');
    btn.disabled = true;
    btn.textContent = (idx === quiz.questoes.length - 1) ? 'Finalizar' : 'Avançar';
  }

  document.getElementById('btn-avancar').addEventListener('click', function () {
    if (selecionadaIdx === null) return;
    var q = quiz.questoes[idx];
    var tempoSeg = Math.round((Date.now() - perguntaMostradaEm) / 1000);
    respostas.push({
      id: q.id,
      topico: q.topico || 'Geral',
      pergunta: q.pergunta,
      alternativa_selecionada_idx: selecionadaIdx,
      correta_idx: q.correta,
      acertou: selecionadaIdx === q.correta,
      tempo_seg: tempoSeg,
      estudar: q.estudar || null
    });
    if (idx === quiz.questoes.length - 1) {
      finalizar();
    } else {
      proximaQuestao();
    }
  });

  function finalizar() {
    pararTimer(); // requisito: cronometro para exatamente ao finalizar
    var duracaoTotalSeg = Math.round((Date.now() - iniciadoEm) / 1000);
    var finalizadoEm = new Date().toISOString();

    telaQuestao.hidden = true;
    telaFim.hidden = false;

    var acertos = respostas.filter(function (r) { return r.acertou; }).length;
    var total = respostas.length;
    var pct = total ? Math.round((acertos / total) * 1000) / 10 : 0;
    document.getElementById('fim-score').textContent = acertos + '/' + total + ' (' + pct + '%)';
    document.getElementById('fim-sub').textContent = 'Tempo total: ' + fmtMMSS(duracaoTotalSeg);

    var msg;
    if (pct >= 100) msg = 'Domínio completo — pode avançar pro próximo bloco.';
    else if (pct >= 60) msg = 'Boa base. Revise os pontos fracos abaixo antes de considerar o tema fechado.';
    else msg = 'Vale revisar o material antes de tentar de novo — foque nos pontos fracos abaixo.';
    document.getElementById('fim-feedback').textContent = msg;

    var porTopico = {};
    respostas.forEach(function (r) {
      var t = r.topico || 'Geral';
      if (!porTopico[t]) porTopico[t] = { erros: 0, total: 0, estudar: {} };
      porTopico[t].total += 1;
      if (!r.acertou) {
        porTopico[t].erros += 1;
        if (r.estudar) porTopico[t].estudar[r.estudar] = true;
      }
    });

    var listaFracos = document.getElementById('lista-fracos');
    var blocoFracos = document.getElementById('bloco-fracos');
    var listaDominados = document.getElementById('lista-dominados');
    var blocoDominados = document.getElementById('bloco-dominados');
    var temFraco = false, temDominado = false;

    Object.keys(porTopico).sort(function (a, b) {
      return (porTopico[b].erros / porTopico[b].total) - (porTopico[a].erros / porTopico[a].total);
    }).forEach(function (t) {
      var s = porTopico[t];
      if (s.erros > 0) {
        temFraco = true;
        var div = document.createElement('div');
        div.className = 'topico';
        var estudarHtml = Object.keys(s.estudar).map(function (e) {
          return '<div class="ler">📖 Para entender melhor, leia: ' + e + '</div>';
        }).join('');
        div.innerHTML = '<div class="nome">' + t + '</div>' +
          '<div class="taxa">' + s.erros + '/' + s.total + ' questões erradas</div>' + estudarHtml;
        listaFracos.appendChild(div);
      } else {
        temDominado = true;
        var d2 = document.createElement('div');
        d2.className = 'topico dominado';
        d2.innerHTML = '<div class="nome">' + t + '</div>';
        listaDominados.appendChild(d2);
      }
    });
    blocoFracos.hidden = !temFraco;
    blocoDominados.hidden = !temDominado;

    var payload = {
      iniciado_em: new Date(iniciadoEm).toISOString(),
      finalizado_em: finalizadoEm,
      duracao_total_seg: duracaoTotalSeg,
      respostas: respostas
    };

    var status = document.getElementById('rodape-status');
    fetch('finalizar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    }).then(function (r) { return r.json(); }).then(function (resp) {
      var graceSeg = resp.encerra_em_seg || 0;
      if (!graceSeg) { status.textContent = 'Resultado salvo.'; return; }
      var restante = graceSeg;
      status.textContent = 'Resultado e relatório salvos. Pode fechar esta aba — o servidor local encerra em ' + restante + 's.';
      var h = setInterval(function () {
        restante -= 1;
        if (restante <= 0) {
          status.textContent = 'Servidor encerrado. Pode fechar esta aba.';
          clearInterval(h);
          return;
        }
        status.textContent = 'Resultado e relatório salvos. Pode fechar esta aba — o servidor local encerra em ' + restante + 's.';
      }, 1000);
    }).catch(function () {
      status.textContent = 'Não consegui confirmar o salvamento com o servidor local — verifique se ele ainda está rodando.';
    });
  }
})();
</script>
</body>
</html>
