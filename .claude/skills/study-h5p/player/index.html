<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>study-h5p</title>
<link rel="stylesheet" href="vendor/h5p-standalone/styles/h5p.css">
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; font: 15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
         background: #f6f7f9; color: #1a1a1a; }
  @media (prefers-color-scheme: dark) { body { background: #16181c; color: #e7e7e7; } }
  .wrap { max-width: 960px; margin: 0 auto; padding: 24px 32px 40px; }
  @media (max-width: 640px) { .wrap { padding: 16px 16px 32px; } }
  .bar { display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
         margin-bottom: 16px; flex-wrap: wrap; }
  .bar h1 { font-size: 16px; margin: 0; font-weight: 600; }
  #timer { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 18px;
           padding: 2px 10px; border-radius: 999px; background: rgba(127,127,127,.15); }
  #timer.warn { background: rgba(220,80,40,.18); color: #d34a28; }
  #status { font-size: 13px; opacity: .7; margin-top: 16px; }
  #h5p { background: #fff; border-radius: 12px; overflow: hidden; padding: 20px;
         box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  @media (max-width: 640px) { #h5p { padding: 12px; } }
  @media (prefers-color-scheme: dark) { #h5p { background: #1f2228; box-shadow: none; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <h1 id="titulo">Exercício</h1>
    <span id="timer" hidden>00:00</span>
  </div>
  <div id="h5p"></div>
  <p id="status">carregando…</p>
</div>

<script src="vendor/h5p-standalone/main.bundle.js"></script>
<script>
(function () {
  var statusEl = document.getElementById('status');
  var timerEl = document.getElementById('timer');
  var tituloEl = document.getElementById('titulo');

  function send(statement) {
    try {
      var body = JSON.stringify(statement);
      if (navigator.sendBeacon) navigator.sendBeacon('resultado', new Blob([body], { type: 'application/json' }));
      else fetch('resultado', { method: 'POST', body: body, headers: { 'Content-Type': 'application/json' }, keepalive: true });
    } catch (e) { /* offline / sem servidor: resultado fica so no navegador */ }
  }

  // Timer opcional: ?tempo=1800 (segundos). So conta; ao zerar, avisa (nao bloqueia o H5P).
  var limite = parseInt(new URLSearchParams(location.search).get('tempo') || '0', 10);
  var inicio = Date.now();
  function tick() {
    var s = Math.floor((Date.now() - inicio) / 1000);
    var restante = limite ? limite - s : s;
    var neg = restante < 0;
    var abs = Math.abs(restante);
    var mm = String(Math.floor(abs / 60)).padStart(2, '0');
    var ss = String(abs % 60).padStart(2, '0');
    timerEl.textContent = (neg ? '-' : '') + mm + ':' + ss;
    timerEl.classList.toggle('warn', !!limite && restante <= 60);
  }
  timerEl.hidden = false; tick(); setInterval(tick, 1000);

  var opts = {
    h5pJsonPath: '.',
    frameJs: 'vendor/h5p-standalone/frame.bundle.js',
    frameCss: 'vendor/h5p-standalone/styles/h5p.css',
    librariesPath: 'vendor/libraries'
  };

  new H5PStandalone.H5P(document.getElementById('h5p'), opts).then(function () {
    statusEl.textContent = 'pronto — responda e conclua a atividade; o resultado e salvo automaticamente.';
    try {
      var inst = window.H5P && H5P.instances && H5P.instances[0];
      var meta = inst && inst.contentData && inst.contentData.metadata;
      if (meta && meta.title) { tituloEl.textContent = meta.title; document.title = meta.title; }
    } catch (e) {}
    if (window.H5P && H5P.externalDispatcher) {
      H5P.externalDispatcher.on('xAPI', function (event) {
        if (event && event.data && event.data.statement) send(event.data.statement);
      });
    }
  }).catch(function (err) {
    statusEl.textContent = 'erro ao carregar: ' + (err && err.message ? err.message : err);
  });
})();
</script>
</body>
</html>
