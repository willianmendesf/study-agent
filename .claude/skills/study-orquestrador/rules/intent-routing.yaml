## Próximo Passo Sugerido

next_step_logic:
  # Após 01-descobrir
  after_01:
    next: "02-organizar"
    message: "Agora vamos indexar seus materiais"
    question: "Você tem livros/PDFs? Ou quer começar com recursos padrão?"

  # Após 02-organizar
  after_02:
    next: "03-aprender"
    message: "Materiais prontos. Vamos começar a aprender!"
    question: "Qual tópico quer explorar primeiro?"

  # Após 03-aprender (90%+)
  after_03:
    if retenção >= 85%:
      next: "04-praticar"
      message: "Você entendeu bem. Vamos praticar?"
    else:
      next: "revisão de 03-aprender"
      message: "Vamos revisar os tópicos que ficaram confusos"

  # Após 04-praticar (7/10+)
  after_04:
    if acertos >= 70%:
      next: "05-testar"
      message: "Pronto para a prova?"
    else:
      next: "mais prática 04"
      message: "Vamos fazer mais exercícios destes tópicos"

  # Após 05-testar (5/5 ou 4/5)
  after_05:
    if acertos >= 80%:
      next: "06-dominio"
      message: "Excelente! Vamos validar seu domínio"
    else:
      next: "revisão + 04-praticar"
      message: "Revisamos os erros e praticamos de novo"

  # Após 06-dominio
  after_06:
    if 100% learning_outcomes:
      next: "novo tópico"
      message: "Parabéns! O que quer aprender a seguir?
               Opções:
               (A) Tópico relacionado [recomendado]
               (B) Aprofundamento neste [Expert level]
               (C) Domínio completamente novo"
    else:
      next: "voltar ao tópico faltante"
      message: "Faltaram alguns conceitos: [lista]
               Quer revisar antes de encerrar?"
